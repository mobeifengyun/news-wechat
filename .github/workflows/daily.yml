name: 报简说·每日生成与发布（云端全自动）

# 定位：完全在 GitHub 云端运行，不依赖本机 WorkBuddy 客户端与本机网络。
# 每天北京时间 07:00 自动：采集 → 渲染+审核 → (可选)公众号群发 → 手机页 → 部署 GitHub Pages → ServerChan 推送。
# 计算免费（GitHub Free 私有库 2000 分钟/月，本流程约 2-3 分钟/天，远低于额度）。
# 联网搜索与成稿由大模型 API 完成（默认 Gemini 免费额度，或 DeepSeek+Tavily，约 ¥0.1/月）。

on:
  schedule:
    - cron: '0 23 * * *'        # UTC 23:00 = 北京时间 07:00
  workflow_dispatch:            # 手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write               # 提交产出（跨期查重 + 历史归档）
  pages: write                  # 部署手机页到 GitHub Pages
  id-token: write

concurrency:
  group: baojianshuo-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出（含完整历史，供跨期互动查重）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r news_wechat/requirements.txt

      - name: 重建 config.json（从 example + Secrets，绝不提交真实密钥）
        env:
          SCKEY: ${{ secrets.SCKEY }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
        run: |
          python - <<'PY'
          import json, os
          ex = 'news_wechat/config.example.json'
          dst = 'news_wechat/config.json'
          c = json.load(open(ex, encoding='utf-8'))
          c['wechat']['sckey'] = os.environ.get('SCKEY', '')
          aid = os.environ.get('WX_APPID', '')
          sec = os.environ.get('WX_APPSECRET', '')
          if aid:
              c['wechat']['appid'] = aid
          if sec:
              c['wechat']['appsecret'] = sec
          json.dump(c, open(dst, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('已重建 config.json（sckey 注入:', bool(c['wechat']['sckey']), '）')
          PY

      - name: 检查当日是否已生成（幂等短路，避免重复推送）
        id: check
        run: |
          DAY=$(python -c "from datetime import datetime,timedelta,timezone; print(datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d'))")
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          # 1) main 已有产出 -> 跳过（含推送）
          if [ -f "news_wechat/output/news_${DAY}.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "当日 $DAY 已存在于 main，整轮跳过"
            exit 0
          fi
          # 2) 线上手机页已含当天 -> 说明此前已成功部署+推送（防 schedule 与 cron-job.org 双触发重复推送）
          export DAY
          python - <<'PY'
          import urllib.request, os
          day = os.environ["DAY"]
          owner = "${{ github.repository_owner }}"
          repo = "${{ github.event.repository.name }}"
          url = f"https://raw.githubusercontent.com/{owner}/{repo}/gh-pages/index.html"
          try:
              h = urllib.request.urlopen(url, timeout=20).read().decode("utf-8", "replace")
              if day in h:
                  open("/tmp/_skip_flag", "w").write("1")
                  print("线上手机页已含", day, "-> 将整轮跳过")
          except Exception as e:
              print("gh-pages 检查失败(视为未部署):", e)
          PY
          if [ -f /tmp/_skip_flag ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: 采集 + 成稿（大模型联网搜索）
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEARCH_MODE: ${{ secrets.SEARCH_MODE }}
        run: python news_wechat/collect.py "${{ steps.check.outputs.day }}"

      - name: 渲染 + 合规审核（BLOCK 会中断）
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python news_wechat/render.py "${{ steps.check.outputs.day }}"

      - name: 注入公众号凭据并群发（可选，未配置则跳过）
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
        run: |
          if [ -n "$WX_APPID" ]; then
            python - <<'PY'
          import json, os
          p = 'news_wechat/config.json'
          c = json.load(open(p, encoding='utf-8'))
          c['wechat']['appid'] = os.environ['WX_APPID']
          c['wechat']['appsecret'] = os.environ['WX_APPSECRET']
          json.dump(c, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('已注入 WX_APPID 凭据')
          PY
            python news_wechat/publish.py || echo "::warning::公众号群发失败，见上方日志"
          else
            echo "未配置 WX_APPID，跳过公众号群发（手机页+ServerChan 仍正常）"
          fi

      - name: 生成手机页
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: python news_wechat/mobile.py

      - name: 部署手机页到 GitHub Pages
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./news_wechat/mobile_dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: 手机页 ${{ github.run_id }}"

      - name: 推送 ServerChan 汇报
        if: ${{ steps.check.outputs.skip != 'true' }}
        env:
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCKEY: ${{ secrets.SCKEY }}
        run: python news_wechat/push_sc.py "$PAGE_URL" "${{ steps.check.outputs.day }}"

      - name: 提交产出（供跨期查重与历史归档）
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$(pwd)"
          git config pull.rebase true
          git add news_wechat/output news_wechat/mobile_dist
          if git diff --cached --quiet; then
            echo "无产出变更，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动产出 $(date +%F)"
          for i in $(seq 1 6); do
            git fetch origin main
            if git rebase origin/main && git push origin main; then
              echo "提交产出成功"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次提交失败，重试..."; sleep 10
          done
          echo "::error::提交产出失败（main 可能有并发提交，请手动同步 output）"; exit 1

      - name: 上传采集诊断（失败可查根因）
        if: always()
        run: |
          if [ -f news_wechat/output/_collect_error.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config --global --add safe.directory "$(pwd)"
            git config pull.rebase true
            git add news_wechat/output/_collect_error.txt
            if git diff --cached --quiet; then
              echo "诊断文件无变更，跳过"
            else
              git commit -m "debug: 采集诊断 $(date +%FT%H%M%S)" || true
              for i in $(seq 1 6); do
                git fetch origin main
                if git rebase origin/main && git push origin main; then break; fi
                git rebase --abort 2>/dev/null || true
                sleep 10
              done
            fi
          fi
