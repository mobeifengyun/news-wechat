5;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>国家疾控局与中国气象局联合发布高温健康风险预警，山东、辽宁、江苏等地部分地区风险极高。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>国家防灾减灾救灾委员会办公室、应急管理部向吉林、黑龙江调拨1.1万件中央救灾物资。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>国铁集团：铁路暑运启动以来，截至7月31日全国铁路已累计发送旅客4.32亿人次。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>据电影平台数据，2026年暑期档总票房含预售突破70亿元，单日票房连续22天破亿。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>暑期档票房前五为《功夫女足》《八仙！》《蜘蛛侠：崭新之日》等，《八仙！》已破10亿。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>国际足联主席因凡蒂诺发表声明，宣布放弃成立商业子公司并出售旗下赛事部分股权提案。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>中央广播电视总台CMG机器人挑战赛点球大战在湖南永州开赛，人形机器人与市民对战。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>央视《文博日历》介绍清雍正孔雀蓝釉瓶，通体施孔雀蓝釉，细小开片布满器身，釉色泛绿。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>安嘉和口碑反转引发热议<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>奶奶做的减脂餐分量惊人<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>《百家讲坛》开播25年再上热榜<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>诺兰新片《奥德赛》点映一票难求<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>退货别提前给快递取件码<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>厦门租客发现4万元现金主动归还<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>外卖打包费须明码标价自愿选择<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>中国空调自由成海外社交平台热词<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>TFBOYS为时代少年团演唱会送花篮<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>周日的好，在于可以慢半拍：该看的天气看一眼，想吃的那口吃到，剩下的事，明天再排队。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">每天只问一个，评论区打一行字就算参与。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#07C160;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">打卡</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">暑期档总票房破70亿，单日连续22天破亿。这个夏天，你贡献了几张票？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:13px;color:#666;line-height:1.9;margin:0;\">格式：<span style=\"color:#333;font-weight:bold;\">城市＋看了几部＋最想推荐的一部</span><br>示例：<span style=\"color:#07C160;\">石家庄＋2部＋《八仙！》</span></p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">照着格式打一行就行，不用写影评。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">明天这一栏，把大家写的片名汇个总。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-01", "title": "报简说 | 每日消息早知道（8月1日）", "digest": "早安！八一建军节，向最可爱的人致敬。周六好，几分钟速览天下事。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月1日 星期六 农历六月十九</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！八一建军节，向最可爱的人致敬。周六好，几分钟速览天下事。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>外交部就菲律宾在中国领土黄岩岛划设所谓领海基线发表声明，严正指出此举非法无效，中方坚决反对、绝不接受。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>巴勒斯坦伊斯兰抵抗运动哈马斯高级成员称，经过激烈谈判已同意最新版本的加沙停火路线图计划。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>伊朗波斯湾海峡管理局称，因美军在相关海域持续采取侵略性行动，霍尔木兹海峡目前已无法正常通行。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>约六万移民24小时内从摩洛哥方向非法越境进入西班牙飞地休达，已致57人死亡，意大利宣布暂停申根通行。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>日本政府正式设立国家情报局并召开首次国家情报会议，系战后首次构建国家层面情报统合体系，引发地区警惕。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>国务院总理李强主持召开国务院常务会议，部署有效扩大内需，决定核准辽宁庄河一期等四个核电项目。<span style=\"color:#999;font-size:12px;\">（央视网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>国内成品油价格迎来年内第十涨，92号、95号汽油每升分别上调0.54元、0.57元。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>国家统计局：7月制造业采购经理指数为49.2%，环比下降1.1个百分点，装备制造业保持较快扩张。<span style=\"color:#999;font-size:12px;\">（国家统计局）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>央行：二季度全国新发放商业性个人住房贷款加权平均利率为3.06%，处于历史较低水平。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>我国新核准8台核电机组，项目总投资超1700亿元，今年新建核电项目延续常态化审批节奏。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>中科院团队制备高性能钙钛矿有机叠层太阳能电池，稳态光电转换效率达28.04%，成果发表于《自然》。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>国家发改委：全国智能算力规模已达去年同期2.8倍，国产大模型全球总下载量突破100亿次。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>中国卫星导航系统管理办公室：北斗卫星导航系统已全面完成在轨升级，将提供更稳定的定位授时服务。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>国家发改委：十五五时期算力网将新增直接投资4万亿元，常州、郑州等多地算力中心建设明显提速。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>山东邹城建成省内最大工业机器人生产基地，26家企业聚集，装配一台机器人本体仅需37分钟。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>中央气象台继续发布暴雨黄色预警，黑龙江、四川、广东等地局地有大暴雨，并伴有雷暴大风等强对流天气。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>水利部研判：八上期间第13号台风白海豚可能登陆影响我国，多地需提前防范持续性强降雨。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>我国将扎实开展为期一年的深化扫黑除恶专项斗争，重点打击利用网络平台实施的有组织黑恶犯罪。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>截至2025年末，我国60周岁及以上老年人口超3.23亿人，全国人均预期寿命达79.25岁。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>中国电信、移动、联通8月1日起停止第三方互联网渠道办卡，以规范售卡管理保障用户权益。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>新华社刊发全媒头条《向前一步走》，写在中国人民解放军建军99周年之际，回顾人民军队发展历程。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>暑期档喜剧电影《功夫女足》上映22天累计票房突破21亿元，成为今年暑期档头部爆款之一。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>四川造动画电影《八仙！》票房突破10亿元（含预售），豆瓣评分稳定在8分以上，实现口碑票房双丰收。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>央视新闻推出《文博日历》，带你认识汉代后羿射日画像石拓片，画面留白叙事堪比电影分镜。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>网红博主食用珍稀动物遭举报调查<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>北极已经可以穿短袖了<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>热成像无人机拍到狼群围猎藏羚羊<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>机构预计8月金价或现较大回调<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>千万粉丝鉴宝网红炒股亏光积蓄<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>2026TF家族运动会开赛登顶热榜<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>UFC上海站8月29日举办<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>热穹顶致北半球多地极端高温<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>军旗猎猎，是有人替我们负重前行；日子安稳，便把手边的事一件件做扎实，就是对这份守护最实在的回应。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">每天只问一个，评论区打一行字就算参与。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#E67E22;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">盲猜</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">《功夫女足》上映 22 天，票房 21 亿，眼下还在放。你猜它下映那天，数字会停在多少？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;letter-spacing:1px;\">我猜 <span style=\"color:#E67E22;font-weight:bold;\">＿＿＿＿</span> 亿</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">写个数字就行，不用解释。等它下映，这一栏回来对答案。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">明天这一栏，会把猜得接近的几条留言贴出来。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-07-31", "title": "报简说 | 每日消息早知道（7月31日）", "digest": "早安！周五好，几分钟速览天下事，从容收官这一周。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年7月31日 星期五 农历六月十八</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！周五好，几分钟速览天下事，从容收官这一周。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>哈马斯与巴勒斯坦各派就加沙停火第二阶段方案达成一致，将分阶段清点并封存武器，等待国际稳定部队部署。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>日本熊本县7.1级地震遇难人数升至34人，另有5人重伤，搜救与排险工作仍在推进。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>伊朗伊斯兰革命卫队称用弹道导弹打击约旦境内美军基地，美方回应称无飞机被摧毁或损坏。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>美联储宣布今年第五次维持利率不变，委员会内部分歧明显，市场高度关注后续政策路径走向。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>经季节调整后，二季度欧元区GDP环比增长0.4%，欧盟GDP环比增长0.5%，经济温和扩张。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>中共中央政治局会议部署下半年经济工作，决定10月召开二十届五中全会，扩大内需保障民生。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>国内成品油调价窗口31日24时开启，机构预计年内第十涨，加满一箱油约多花27元左右。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>A股三大股指31日集体高开，创业板指涨逾5%，半导体、存储与算力硬件产业链大幅反弹。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>上半年我国可再生能源发电量占比首超四成，煤电发电量占比首次低于50%，能源绿色转型提速。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>世界黄金协会：二季度全球央行及官方机构净增黄金储备289吨，同比增长62%，购金意愿回升。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>国家发改委：全球每销售10台人形和四足智能机器人，就有8台产自中国，产业链优势十分突出。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>国家发改委：首个全国产10万卡人工智能超集群投用，智能算力规模达去年同期2.8倍。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>我国自主研制的世界最大直径高铁盾构机领航号，成功穿越长江水域，崇太长江隧道水域段贯通。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>之江实验室三体计算星座加速组网，已在轨部署20个人工智能模型，推动太空智能应用落地。<span style=\"color:#999;font-size:12px;\">（中国青年报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>国家发改委：C919累计交付41架、安全飞行超13万小时，长征十号乙发射回收成功。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>甘肃省气象局将暴雨应急响应升为Ⅱ级，防汛办发布山洪灾害气象风险红色预警，未来24小时局地有大暴雨。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>中央气象台31日继续发布暴雨黄色预警，西南华南华北等地将现分散性大到暴雨，东北部分地区或有大暴雨。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>重庆彭水山体崩塌灾害现场搜寻完毕，已确认51人遇难，仍有10名失联人员，搜救处置工作持续推进。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>北京出台快递外卖行业非机动车新规，平台算法不得超速、不得推荐逆行禁行路线，8月1日起施行。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>吉林汪清县遭遇极端强降雨紧急转移9个乡镇8000多人，当地正抢修交通电力通信等设施。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>2026年暑期档电影总票房含预售突破65亿元，《功夫女足》票房已超20亿元，领跑档期。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>动画电影《八仙！》上映后口碑持续发酵，累计票房突破9亿元，成为今年暑期档最大黑马。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>中国作协发布网络文学蓝皮书，截至2025年底作品总量超3300万部，读者规模超5亿人。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>国际冰联宣布不允许俄罗斯参加2027年男子冰球世锦赛、世青赛及U18世锦赛，白俄罗斯亦被限制参赛。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>民政部与国家文物局启动全国区划地名文物名录建设，首批试点约15个地区，试点期原则上为一年。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>取消午休4点下班你会同意吗<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>董宇辉对话周星驰访谈引热议<span style=\"color:#999;font-size:12px;\">（抖音热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>38岁清华毕业生被北大医学部录取<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>17岁小将魏璟茗击败世界冠军蒯曼<span style=\"color:#999;font-size:12px;\">（新浪热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>孙浩自曝翻红后没赚一分钱<span style=\"color:#999;font-size:12px;\">（微信热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>上海疾控回应新冠话题频上热搜<span style=\"color:#999;font-size:12px;\">（百度热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>宇树科技科创板8月10日申购<span style=\"color:#999;font-size:12px;\">（36氪）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>券商热议长鑫科技市值剑指5万亿<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>ChinaJoy在上海开幕近900家厂商参展<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">10. </span>三星HBM4存储芯片实现规模化量产<span style=\"color:#999;font-size:12px;\">（酷安）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">11. </span>马斯克称人类5至7年后可登陆火星<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>别急着赶路，先稳住脚下；把手边小事做扎实，日子自会给出回响。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-07-30", "title": "报简说 | 每日消息早知道（7月30日）", "digest": "早安！用几分钟速览天下事，开启元气满满的一天。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年7月30日 星期四 农历六月十七</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！用几分钟速览天下事，开启元气满满的一天。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>日本熊本县6.8级地震遇难人数升至14人，多地基础设施受损、交通受阻，当地救援排险工作仍在进行。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>伊朗拒绝阿曼提出的联合管理霍尔木兹海峡航运地区机制，并提出通过海峡的船只须经过伊朗水域。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>德国宝马集团宣布为降低成本，计划于2027年底前在全球裁减约8000个工作岗位，波及多个业务板块。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>美联储宣布今年连续第五次维持联邦基金利率不变，市场关注后续政策路径及美国经济数据变化走向。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>李强、赵乐际29日分别会见斯洛伐克总统佩列格里尼，双方表示将深化经贸、人工智能等领域互利合作。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>央行提前公告将在月末及8月初开展隔夜逆回购操作，多家机构预计流动性有望平稳跨月，资金面无虞。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>30日A股三大股指集体低开，半导体、算力硬件产业链持续调整，黄金、油气、煤炭等资源板块走强。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>国家发改委表示将从推动政府投资到位、加快重大工程开工、激发民间投资活力三方面促进投资回稳。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>国家邮政局发布邮政业十五五规划，预计2030年寄递业务量达2900亿件，快递业务收入达2万亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>我国在文昌成功发射天链三号01星，卫星顺利进入预定轨道，此次是长征系列运载火箭第659次飞行。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>C919高原型首架机在上海浦东机场完成首次飞行试验，标志着C919飞机系列化发展迈出重要一步。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>国家知识产权局：上半年我国共授权发明专利45.3万件，核准注册商标205.5万件，创新活力持续释放。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>市场监管总局批准发布《智能家用电器质量安全风险分类评价指南》国家标准，2027年2月1日起实施。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>吉林汪清县29日将防汛应急响应提升至一级，进入紧急防汛期，采取停课停工停业停运等五停管控措施。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>中央气象台预计30日西北地区东部、华北南部等地有中到大雨，四川盆地中西部局地有暴雨或大暴雨。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>青海兴海县抗震救灾工作有序推进，全县累计避险转移35086人，设立安置点120处，暂无人员伤亡。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>国家发改委原副主任徐宪平受贿案一审宣判，被告人被判处有期徒刑十五年，并处罚金人民币五百万元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>昆明检测列车撞人致11死2伤事故追责，国铁昆明局对事故负全部责任，被处以300万元行政处罚。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>2026年度电影总票房含预售突破220亿元，《飞驰人生3》《功夫女足》《给阿嬷的情书》暂列前三。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>思想解读类融媒体片《制胜》30日起在央视综合频道播出，由中央军委政治工作部等联合摄制推出。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>央视新闻联合全国博物馆推出《文博日历》，今日带你认识西晋青瓷胡人骑狮器，釉色清润造型精巧。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>24岁女孩正颌手术被做反，武汉卫健部门介入<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>日本确认南鸟岛海泥含稀土引关注<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>华为李小龙回应手机电池锁容问题<span style=\"color:#999;font-size:12px;\">（酷安）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>数码博主极客湾手机续航大横评引热议<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>于正发文否认与陈哲远有恩怨<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>张凌赫王楚然新剧《这一秒过火》开播<span style=\"color:#999;font-size:12px;\">（新浪热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>电影《群星闪耀时》官宣撤档<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>微软最新财报公布后盘后股价大涨8%<span style=\"color:#999;font-size:12px;\">（36氪）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>2026世界机器人大会8月19日在北京开幕<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>把心放宽，把事做细；不与昨天较劲，只为明天蓄力。晨光从不辜负赶路的人。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-07-29", "title": "报简说 | 每日消息早知道（7月29日）", "digest": "工作愉快，生活喜乐！一文速览，众晓天下事。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年7月29日 星期三 农历六月十六</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">工作愉快，生活喜乐！一文速览，众晓天下事。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>外交部就日本未及时严惩擅闯中国驻日使馆凶犯表明立场，对日方找借口拖延处理表示强烈不满，已提出严正交涉。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>美国总统特朗普28日在白宫与到访的以色列总理内塔尼亚胡举行会晤，白宫称此次会谈具有积极和建设性意义。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>俄罗斯总统普京签署扩军令，俄军编制总员额增至242.6万人，新增2.5万员额，进一步强化俄军事力量建设。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>日本熊本县发生强烈地震并造成多人伤亡，当地救援工作正在进行，具体灾情和人员伤亡情况仍在进一步统计中。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>苹果公司总市值逼近5万亿美元，超越英伟达成为全球市值第一，英伟达因存储板块下跌创单日最大跌幅。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">6. </span>国际油价大幅下跌，WTI原油收跌7.5%，布伦特原油下跌8.7%，主要受地缘政治风险短期缓和影响。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>国产存储龙头长鑫科技27日登陆科创板，收盘大涨465.82%，总市值达3.28万亿元，登上A股市值榜首位置。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>国家税务总局：2025年度个税汇算超1亿纳税人申报退税，退税金额突破1500亿元，上半年个税收入约9000亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>8月1日起个人贷款业务明示综合融资成本新规施行，消费者办贷款将获清晰“明白账”，息费不透明问题有望终结。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>中央广播电视总台首届智能机器人应用技能大展在京启动，聚焦生产制造、仓储物流、应急救援等真实应用场景。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>商务部回应美方拟制裁中国人工智能企业，敦促美方停止科技霸权行径，表示将坚决维护中国企业的合法权益。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>国家能源局：截至6月底全国电动汽车充电基础设施总数达2305.7万个，同比增长43.2%，充电网络加速完善。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>中央气象台29日发布暴雨黄色和强对流蓝色双预警，广东西南部、四川盆地西南部、河南中西部局地有大暴雨。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>重庆彭水山体崩塌救援持续，经DNA检测鉴定累计确认30名遇难者，部分搜寻结果仍在检测中，处置工作仍在进行。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>青海海南州兴海县28日接连发生5.7级、5.8级、5.0级地震，截至目前暂无人员伤亡报告，当地已启动应急响应。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>民政部门上半年累计处置非法社会组织702个，冒用“中国”“全国”等字样误导公众的组织被纳入打击整治重点。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>教育部：2025年全国累计资助学生近1.6亿人次，比2024年增长超过5%，学生资助政策体系覆盖面持续扩大。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>河北衡水通报多名公职人员被举报侵吞学校资产：已成立联合调查组全面核查，将依法依规严肃处理并及时公布。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>2026年暑期档电影总票房含预售已突破60亿元，超过去年同期水平，多部国产影片表现强劲带动暑期观影热潮。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>国际射联全项世界杯杭州站，中国组合包揽10米气步枪混合团体冠亚军，中国队以7金6银5铜高居奖牌榜首位。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>辽宁大连长山群岛候鸟栖息地列入世界自然遗产，我国黄（渤）海候鸟栖息地系列世界遗产实现再次成功扩容。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#f px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">10. </span>苹果首款折叠机量产在即：蓝思科技供UTG盖板<span style=\"color:#999;font-size:12px;\">（酷安）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>不必纠结他人评价，每个人都有自己的活法，守好内心的平和，自在胜过所有赞美。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}];
var cur = 0;

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

function render(i){
  cur = i;
  var d = DATA[i];
  document.getElementById('paper').innerHTML = d.html;
  document.getElementById('mTitle').textContent = d.title;
  document.getElementById('mDigest').textContent = d.digest || '';
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b, k){
    b.className = (k === i) ? 'on' : '';
  });
  window.scrollTo(0, 0);
}

function copyRich(){
  var node = document.getElementById('paper');
  var sel = window.getSelection();
  var range = document.createRange();
  range.selectNodeContents(node);
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  sel.removeAllRanges();
  if (ok) { toast('已复制，去订阅号助手粘贴'); return; }
  if (navigator.clipboard && window.ClipboardItem) {
    var html = node.innerHTML;
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([node.innerText], {type:'text/plain'})
    })]).then(function(){ toast('已复制，去订阅号助手粘贴'); })
      .catch(function(){ toast('自动复制失败，请长按正文手动全选'); });
  } else {
    toast('自动复制失败，请长按正文手动全选');
  }
}

function copyCode(){ copyText(DATA[cur].html, '源码已复制'); }

function copyText(txt, msg){
  var s = document.getElementById('sink');
  s.value = txt; s.select(); s.setSelectionRange(0, txt.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function(){ toast(msg); });
    return;
  }
  toast(ok ? msg : '复制失败');
}

(function init(){
  var tabs = document.getElementById('tabs');
  DATA.forEach(function(d, i){
    var b = document.createElement('button');
    b.textContent = d.date.slice(5);
    b.onclick = function(){ render(i); };
    tabs.appendChild(b);
  });
  render(0);
})();
</script>
