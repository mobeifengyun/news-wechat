<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script>
var DATA = [{"date": "2026-08-11", "title": "报简说 | 每日消息早知道（8月11日）", "digest": "早安。今天是丙午年六月廿九，周二，认真过好每一天，生活自会给出回应。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月11日 星期二 农历丙午年六月廿九</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安。今天是丙午年六月廿九，周二，认真过好每一天，生活自会给出回应。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>朝鲜国际安保评论家发文，斥日本2026年版《防卫白皮书》是再侵略白皮书，呼吁国际社会警惕其军事大国化动向。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>当地时间11日凌晨，俄军对乌克兰首都基辅发动弹道导弹袭击，市区连续传出强烈爆炸声，基辅市长确认遭袭。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>欧洲、亚洲及中北美足联联合公开信再批国际足联，要求将FFE事件交由完全独立第三方审查，维护治理机制。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>发改委、能源局印发《煤炭工业发展十五五规划》，提出到2030年基本建成现代煤炭产业体系，保障能源安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>南水北调东中线一期工程累计调水突破900亿立方米，惠及7省市48座城市1.95亿人口，供水格局持续优化。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>港珠澳大桥珠海公路口岸进出境车辆累计突破2500万辆次，单日峰值达2.97万辆次，大湾区联通再提速。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>中央政府将于8月20日在澳门发行60亿元人民币国债，这是支持澳门离岸人民币市场发展的常态化举措。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>商务部发布公告，决定对原产于墨西哥和美国的进口碧根果发起反倾销立案调查，维护国内产业公平竞争。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">6. </span>财政部、应急管理部紧急预拨1.8亿元中央救灾资金，支持多地防汛防台风及抗旱，保障群众基本生活。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>全国用电负荷入夏以来第四次创历史新高，多地高温带动空调负荷攀升，电网企业全力保供迎峰度夏。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>我国科学家发布最新月球『宝藏图』，系统梳理月球资源分布与演化，为后续月球探测提供关键参考。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>2025年我国年度数据生产量达52.26ZB，同比增长显著，数据要素正成为驱动数字经济的新引擎。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>AI视频大模型竞速商业化，多家企业密集落地应用，影视、广告、教育等内容生产迎来降本提速。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>自动驾驶有了全国统一准入门槛，工信部发布相关标准，明确功能安全与测试要求，促进行业规范发展。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">6. </span>从『中国神器』看中国制造迭代升级，高端装备、智能产线加速出海，产业链韧性与竞争力持续增强。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>台风『白海豚』深入内陆，10余省份有强降雨，国家防减救灾委对浙江启动四级救灾应急响应并派工作组。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>公安部指挥全国公安机关开展扫黑除恶专项斗争第一轮集中收网，打掉犯罪团伙千余个，抓获嫌疑人8200余名。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>市场监管总局通报驾培行业抱团涨价、协会串谋等乱象，将保持反垄断高压，常态化整治违规收费行为。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>针对总台报道乡村排污乱象，湖南冷水江、河北故城、湖北郧西分别通报，成立联合调查组核查整改。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>北京市朝阳区市场监管局对潘家园附近眼镜市场开展专项执法检查，对涉嫌不合格太阳镜依法实施暂扣。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>近日全国多地持续高温，气象部门提醒做好防暑降温与能源保供，户外作业应避开高温时段保障安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>第38届大众电影百花奖今日揭晓，多项大奖花落各家，国产现实题材影片与青年演员表现亮眼受关注。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>第十二届全国少儿曲艺展演亮相，50个节目登台，涵盖相声、快板、评书等形式，展现少儿曲艺传承活力。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>国家大剧院将经典电影《一江春水向东流》搬上话剧舞台，以话剧语汇重述时代故事，引发观众共鸣。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>《开心消消乐》12周年庆大同站启幕，线上线下联动打造沉浸式文旅新体验，晋式消夏玩法受青睐。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>2026世界人工智能大会发布《中国智能经济议题涌现报告》，梳理智能经济新趋势与产业落地路径。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><  style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>我国牵头制定全球首项卷曲显示器件国际标准正式发布，填补了展平力测试方法空白领域。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>我国渤海千亿方大气田渤中19-6一期开发项目全面投产，日产油气当量超5200吨。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>中国代表队首次参加国际核科学奥赛斩获一金三银，彰显我国青年科研力量正崭露头角，未来可期。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>台风白海豚两次登陆浙江后减弱为热带风暴，给华东多省带来持续性强降雨天气过程，需加强防范。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>水利部与气象局9日18时联合发布红色山洪灾害气象预警，浙皖等地发生山洪灾害风险很大。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>国家防总继续维持对浙江福建防汛防台风三级应急响应，多地全力开展防汛抢险救灾，确保安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>微信视频号AI带货管理新规于8月10日正式上线，AI生成短视频必须主动标注来源。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>江西一乡村自建露天泳池获人民日报关注，其基层柔性治理 line-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>大白兔奶糖的包装纸火了<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>DeepSeek推理到一半说自己饿了<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>女子用漏洞0元买3千台电器<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>工作其实是很养人的<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>双休<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>6图看我国海洋经济稳步增长<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>薛之谦演唱会杭州站取消<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>台风致多场演唱会紧急取消<span style=\"color:#999;font-size:12px;\">（抖音热搜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>把复杂的事做简单，把简单的事做长久，日子自有回响。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">立秋刚过，暑热未退。说说你家乡今天的天气，体感是热是凉？</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#16A085;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">填空</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">立秋后你家乡今天几度？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;\">我家乡在__，今天气温__度，体感__。</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">填空：城市 + 实测温度 + 一句体感（热/凉/闷都行）</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">把你的答案打在评论区，看看天南地北的秋意差多少。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-07", "title": "报简说 | 每日消息早知道（8月7日）", "digest": "早安！周五好，农历六月廿五，今天立秋，先花两分钟把天下事看个大概。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月7日 星期五 农历六月廿五</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！周五好，农历六月廿五，今天立秋，先花两分钟把天下事看个大概。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>当地时间6日，伊朗方面公开霍尔木兹海峡管理战略计划初步草案，拟限制部分国家船只通行。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>受此影响，7日凌晨国际原油期货涨幅扩大，布伦特原油一度上涨超5%，报83美元一线。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>西班牙飞地休达地方政府6日表示，上周发生的大规模非法越境事件已造成至少100人死亡。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>受持续热浪影响，意大利卫生部纳入高温监测的27座主要城市6日全部发布最高等级红色预警。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>当地时间6日，美国总统特朗普签署行政令，对进口多晶硅及其衍生产品加征关税并设最低价。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>网络安全审查办公室6日发布公告，依法对美国派拓公司在华销售的产品实施网络安全审查。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>中国人民银行与阿根廷中央银行近日续签双边本币互换协议，规模1300亿元，有效期五年。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>6日A股沪指涨0.57%报3900.35点，深证成指跌0.24%，两市成交额超过2.5万亿元。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>中国机械工业联合会6日发布数据，上半年我国机械工业规上企业增加值同比增长6.4%。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>中国黄金协会数据显示，上半年我国黄金产量152.9吨，黄金消费量同比增长1.23%。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">6. </span>中国连锁经营协会简报显示，上半年六成连锁餐饮企业门店数量实现净增长，经营稳中有进。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>我国科研人员领衔的北京谱仪III合作组历经15年研究，首次证明全新物质形态胶球的存在。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>我国科研团队编制的1∶500万《月球地质图》正式完成，标注13519个撞击坑和81个撞击盆地。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>我国自主三代核电华龙一号将迭代升级，首批2.0示范项目落地浙江金七门与广东太平岭。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>全球首座16兆瓦张力腿浮式风电平台海油安澜号6日成功接入陆丰油田电网，直供绿电。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>哈尔滨至伊春高铁6日启动按图运行试验，全长318公里，通车后两地旅时将缩至2小时左右。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>今天我们迎来二十四节气中的立秋，这是秋季的第一个节气，多地暑热仍将持续一段时间。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>中央气象台7日继续发布台风黄色预警，白海豚可能9日至10日在浙江到福建北部沿海登陆。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>强制性国标《化妆品 安全通用要求》6日发布，2028年起实施，1987年旧标准同步废止。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>新国标全面收紧儿童化妆品卫生指标，微生物限量要求比一般化妆品严格十倍，从严监管。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>中央气象台预计，黑龙江中东部、吉林北部、北京、重庆西南部等地部分地区有中到大雨。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>两部门联合印发“十五五”公共机构节能降碳工作方案，部署公共机构绿色低碳转型任务。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>据网络平台数据，2026年暑期档票房已突破77亿元，年度电影总票房超过235亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>周星驰执导的《功夫女足》累计票房突破22亿元，片方宣布影片密钥延期至8月31日。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>国产动画电影《八仙！》累计票房突破12亿元，将陆续在澳大利亚、北美、英国等地上映。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>北京时间6日，WTT横滨冠军赛女单八分之一决赛，中国选手陈幸同战胜帕瓦德晋级八强。<span style=\"color:#999;font-size:12px;\">（央视网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>中国女篮7日晚在海口迎战尼日利亚女篮，这是球队备战9月女篮世界杯的首场关键热身赛。<span style=\"color:#999;font-size:12px;\">（央视网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">6. </span>央视《文博日历》立秋推介清代宜兴紫砂仿生壶，壶身缀红枣花生等干果，藕节弯成壶嘴。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>追星要先照顾好自己<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>原来不上班有这么多能做的事<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>公职人员停车受阻暴力损坏地锁<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>为什么DeepSeek新版后训练如此有效<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>DeepSeek宣布近期整体上调API定价<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>宇树科技确定发行价150.8元每股<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>SpaceX火箭残骸撞击月球表面<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>刚果（金）禁止铜钴精矿出口<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>韩国散户涌入美国三倍杠杆产品<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>立秋只是节气翻了一页，暑气不会当天就退。日子也一样，慢慢来，反而比较快。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">今天立秋，老话讲究“咬秋”，这一问就落在碗里。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#07C160;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">打卡</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">立秋这天，你打算用哪一口“咬秋”？照下面格式打一行就行。</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:13px;color:#666;line-height:1.9;margin:0;\">格式：<span style=\"color:#333;font-weight:bold;\">咬秋+吃的东西+吃的时间</span><br>示例：<span style=\"color:#07C160;\">咬秋+西瓜+晚饭后</span></p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">一行搞定，不用写理由。明天挑几条念念，看看大家立秋都在吃什么。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">明天这个位置继续，一天只问一个。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-06", "title": "报简说 | 每日消息早知道（8月6日）", "digest": "早安！周四好，农历六月廿四，中伏第十一天，先花两分钟把天下事看个大概。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月6日 星期四 农历六月廿四</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！周四好，农历六月廿四，中伏第十一天，先花两分钟把天下事看个大概。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>乌克兰总统泽连斯基5日称，俄军对首都基辅及周边地区大规模空袭已致17人死亡、44人受伤。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>伊朗外交部副部长表示，伊朗与阿曼关于商业船舶通行霍尔木兹海峡的协议已接近最终敲定。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>当地时间4日，巴西政府决定将巴西与阿根廷的外交关系降为代办级，两国关系明显降温。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>美国国际贸易法院披露，美国海关已退回依据《国际紧急经济权力法》征收的约1000亿美元关税。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>今夏欧洲多地遭遇持续热浪、降雨偏少，英国多地陷入干旱，多瑙河与莱茵河水位显著降低。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>商务部5日宣布对美方系列涉华消极措施实施反制，将应用DNA科学公司等6家美国实体列入反制清单。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>商务部同日公告，加强无人机及其关键零部件、相关技术对美国出口，一律逐案从严审核。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>中国人民银行5日以固定数量、利率招标方式开展5000亿元买断式逆回购操作，期限为3个月。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>财政部5日第三次续发行超长期特别国债，30年期固定利率附息债730亿元，票面利率2.23%。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>上半年我国服务进出口总额37797.5亿元、同比增长8.3%，知识密集型服务出口占比达53.5%。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">6. </span>多家航空公司自5日出票起下调国内航线燃油附加费，800公里以上航线每位成人收70元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>神舟二十一号航天员张陆、武飞、张洪章5日在北京航天城与记者见面，返回后首次公开亮相。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>5日10时38分，我国在山东海阳附近海域用捷龙三号火箭成功发射东方慧眼高光谱01、02星。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>中科院近代物理研究所依托强流重离子加速器装置，成功产生并鉴别出稀有原子核铪-153。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>工信部5日发布面向L3、L4级自动驾驶的更高阶智能驾驶强制性国家安全标准，护航智能出行。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>微信鸿蒙版应用安装量5日正式突破7000万次，同时开启8.0.20系列版本的邀测升级。<span style=\"color:#999;font-size:12px;\">（IT之家）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>今年第13号台风“白海豚”6日晨位于温州偏东约1360公里洋面，将逐渐向华东沿海靠近。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>财政部、应急管理部5日紧急预拨3.3亿元中央自然灾害救灾资金，支持黑龙江等8省市抢险救灾。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>水利部5日向山西、黑龙江、陕西等13省份发出“一省一单”靶向预警，通报强降雨覆盖县名单。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>河南省近日发布带薪休假新政，要求领导干部带头休假，无法休假按日工资300%支付报酬。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>最高人民法院近日召开全国法院深化扫黑除恶专项斗争动员部署会，部署下一阶段重点工作。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>金融监管总局在浙江试点“个人身后金融事”一站式查询，可查逝者银行资产与保险等信息。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>据网络平台数据，2026年度电影总票房含预售已突破235亿元，其中暑期档票房突破77亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>《功夫女足》上映第24天单日票房逆跌收3650万元，累计逼近22亿元，居暑期档首位。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>国风动画电影《八仙！》上映19天累计票房12.45亿元，跻身中国影史动画片票房榜前十。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>联合国教科文组织5日宣布，根据联合委员会推荐，正式确认北京为2029年“世界建筑之都”。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>国家广电总局7月对热播剧开展重点监测，共清理侵权链接385万条，处理侵权账号385个。<span style=\"color:#999;font-size:12px;\">（光明日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">6. </span>日本推理小说作家东野圭吾遗作《永恒的记忆》5日在日本正式发售，为其第106部著作。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>建设银行试点午休1.5小时<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>中国传媒大学多个专业取消艺考<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>抱冬瓜睡觉的第一批受害者出现了<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>迪丽热巴新剧角色取名引发讨论<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>大盘鸡里到底该不该放土豆<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>百日千万招聘推出四个线上专场<span style=\"color:#999;font-size:12px;\">（百度热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>男子举永州大旗跑遍苏超各主场<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>小学音乐老师校内拍跳舞视频被约谈<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>济南玉符河三位救人者被找到<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>日子不必天天都有惊喜，能把手边这件事踏踏实实做完，这一天就没白过。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">先兑现昨天的承诺，再问今天这一个。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#8E44AD;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">上期揭晓</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">昨天请大家猜：今年7月全国平均气温，比常年同期偏高了多少度？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;\">1.3℃。全国平均23.5℃，为历史同期第二高。</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">猜1.0到1.5之间的朋友最接近，眼力不错。今天接着这个话头问一句：这个夏天你所在的城市，最热的那天你是怎么熬过去的？空调续命、绿豆汤、还是干脆躲进商场蹭凉，用一句话说说。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">明天这个位置继续，一天只问一个。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-05", "title": "报简说 | 每日消息早知道（8月5日）", "digest": "早安！周三好，农历六月廿三，中伏第十天，先花两分钟把天下事看个大概。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月5日 星期三 农历六月廿三</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！周三好，农历六月廿三，中伏第十天，先花两分钟把天下事看个大概。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>美国财政部长贝森特4日表示，美方可能于5日与伊朗达成协议，从而开放霍尔木兹海峡通航。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>韩国政府4日召开国务会议，通过《刑事诉讼法》修正案，全面取消检察机关直接侦查权限。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>美国25个州向美国国际贸易法院提起联合诉讼，要求裁定最新一轮关税措施违法并予以废止。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>乌克兰首都基辅5日拉响防空警报并传出爆炸声，当地市长通报该市遭到弹道导弹袭击，已组织居民紧急避险。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>韩国近日遭遇历史罕见高温天气，截至3日全国累计报告中暑病例2221例，防暑形势严峻。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>中国人民银行5日开展5000亿元买断式逆回购操作，期限3个月，实现净投放2000亿元。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>央行7月通过买断式逆回购、中期借贷便利和国债买卖，累计投放8500亿元中长期流动性。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>4日A股三大指数集体收涨，创业板指涨5.64%，全市场超3600只个股上涨，成交超2.2万亿元。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>四部门联合印发《关于健全金融机构治理的实施意见》，证券行业普遍认为治理能力成新壁垒。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>主板风险警示类股票涨跌幅限制由5%上调至10%，标志市场交易规则迈入统一化新阶段。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>我国4日在海南商业航天发射场用长征八号甲运载火箭，成功发射卫星互联网低轨23组卫星。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>《智能网联汽车自动驾驶系统安全要求》强制性国家标准发布，拟于明年7月1日起正式实施。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>中国气象局王劲松研究员荣获威廉·诺德伯格奖章，为首位获此殊荣的中国科学家，同步获小行星命名。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>广电总局通报7月“AI魔改”视频治理情况，重点平台共清理违规视频13300余条、账号30余个。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>华为全场景新品发布会5日举行，重798克的MateBook Pro S轻薄本正式发布。<span style=\"color:#999;font-size:12px;\">（IT之家）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>教育部印发行动指南，今年秋季新学期起，4至9年级每名学生每学期至少完成1项科学探究任务。<span style=\"color:#999;font-size:12px;\">（中国青年报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>国家气候中心预计，8月我国暴雨、高温、台风将偏多，东部地区涝重于旱，西北有干旱风险。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>今年7月全国平均气温23.5℃，较常年同期偏高1.3℃，为历史同期第二高，多地创同期新高。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>国家防灾减灾救灾委员会针对黑龙江近期严重洪涝，启动国家四级救灾应急响应并派出工作组。<span style=\"color:#999;font-size:12px;\">（央视网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>国家发展改革委紧急安排5000万元中央预算内投资，支持黑龙江洪涝灾害灾后应急恢复。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>国家邮政局依法对申通快递有限公司立案调查，此前该企业多发生产安全事故，引发社会广泛关注。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>截至3日18时，2026年电影暑期档总票房突破75亿元，《功夫女足》以21.79亿元暂列首位。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>国风动画《八仙!》重构传统神话，凭鲜明东方美学风格与通俗叙事，成为暑期档动画代表作品。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>中国球员韩旭在女子美职篮赛场持续发挥，登顶该联赛亚洲球员历史得分榜，创下新的纪录。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>中国奥委会联合李宁发布名古屋亚运会中国体育代表团领奖装备，以“熠熠星辉”为设计理念。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>国家电影局与商务部启动“电影+”消费综合试点，全国16个城市被列为首批试点城市。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>鸿蒙智行回应“竹知了”玩具争议<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>千万不要把手机交给商家写好评<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>微信回应“临时好友”功能建议<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>暑期机票酒店打折旅游为何遇冷<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>上千名从业者联名呼吁放缓AI发展<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>老师试卷藏白色文字揪出AI代写<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>上海飞东京航班降落时与他机异常接近<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>深圳滨海大道地面沉降已交通管制<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>桂林通报卫生巾疑现虫卵已现场核查<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>别急着给这一天下定义，天亮之后一件件做过去，它自然会长成你想要的样子。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">每天只问一个，评论区打一个数字就算参与。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#E67E22;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">盲猜</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">气象部门说，今年7月全国平均气温23.5℃，是历史同期第二高。你猜它比常年同期偏高了多少度？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;letter-spacing:1px;\">我猜 <span style=\"color:#E67E22;font-weight:bold;\">＿＿＿＿</span> ℃</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">只填数字，保留一位小数就行，比如0.8。给个参照：新疆艾丁湖那边最高冲到过50.2℃。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">答案明天在这儿揭晓，猜得最接近的几条留言，我明天挑出来念给大家听。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-04", "title": "报简说 | 每日消息早知道（8月4日）", "digest": "早安！周二好，农历六月廿二，暑气未退，先花两分钟把天下事看个大概。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月4日 星期二 农历六月廿二</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！今天是8月4日星期二，农历六月廿二，两分钟把昨夜今晨的要闻过一遍。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>美国总统特朗普称美伊谈判已于3日开始，伊朗外交部发言人当天回应称近日没有相关会谈计划。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>俄罗斯国防部通报，俄防空力量2日在多地共击落1158架固定翼无人机，数量创下单日新高。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>日本财务大臣3日发表声明，称日方已于7月31日与美国联合干预外汇市场，必要时将追加措施。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>西班牙警方3日表示，约7.35万名移民已从北非自治市休达返回摩洛哥，当地秩序正逐步恢复。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>瑙鲁政府宣布正式更改国名，英文拼写由Nauru变更为Naoero，中文译名仍为瑙鲁保持不变。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>《新型电力系统建设“十五五”规划》发布，明确到2030年我国初步建成新型电力系统的目标。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>上半年保险市场运行总体平稳，分红险原保险保费收入约1.01万亿元，同比增长94.4%。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>上半年我国汽车出口531万辆，同比增长53%，继续巩固全球汽车出口大国的市场地位。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>证监会表示，将继续支持拓展国际布局的境内企业赴港上市，支持优质港股公司在境内上市。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>自然资源部发布数据，上半年我国海洋生产总值达5.5万亿元，按可比价格计算同比增长5.1%。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>阿里巴巴3日发布新一代基座大模型千问3.8-Max，总参数量2.4万亿，模型权重将于下周开源。<span style=\"color:#999;font-size:12px;\">（IT之家）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>MiniMax开源全模态视频模型H3，可生成最长15秒、2K分辨率并带原生立体声音频的视频内容。<span style=\"color:#999;font-size:12px;\">（IT之家）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>中广核广东太平岭核电项目2号机组3日投产发电，粤港澳大湾区华龙一号一期工程全面建成。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>国务院公布新修订的《集成电路布图设计保护条例》，扩展保护范围并加大侵权赔偿力度。<span style=\"color:#999;font-size:12px;\">（中国政府网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>两部门印发文件提出，到2030年建成可支撑超过1.1亿辆电动汽车出行的充电基础设施网络。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>针对牛蛙产品抗生素超标的报道，福建东山、广东澄海和饶平等地通报已对涉事产品封存送检。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>上海市交通管理部门3日集中约谈全市12家网约车平台，首批集中行政处罚金额超2500万元。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>中央气象台预计，今年第13号台风“白海豚”将于6日至7日移入东海，7日后趋向华东沿海。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>应急管理部等三部门向陕西调拨6.5万件中央救灾物资，支持做好受灾群众救助安置工作。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>中央网信办部署网络娱乐团播乱象专项整治，督促各平台依法依约处置违规账号1840余个。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>京沪高铁等200多趟列车3日开启国庆假期车票预约，提供最长开车前60天的预约购票服务。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>据网络平台数据，截至3日2026年暑期档电影总票房突破75亿元，已连续24天单日票房过亿。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>周星驰执导的《功夫女足》上映以来累计票房达21.68亿元，暂居今年暑期档票房榜首位。<span style=\"color:#999;font-size:12px;\">（环球时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>《蜘蛛侠：崭新之日》于7月29日上映，目前累计票房8.39亿元，首日票房曾突破2亿元。<span style=\"color:#999;font-size:12px;\">（环球时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>欧足联3日表示，将就国际足联拟出售世界杯等赛事部分商业权益的改革计划采取法律行动。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>世乒联横滨冠军赛4日展开首轮争夺，陈幸同、周启豪等多名中国乒乓球队选手先后登场比赛。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>简直可以用浓油赤酱来形容一个玉米<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>3日到5日广东暴雨套餐上线<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>京津冀又有大暴雨<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>韩将取消外国游客医美退税<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>博主曝光内蒙古一火锅店用阴阳菜单<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>黄奕回应女儿出道<span style=\"color:#999;font-size:12px;\">（新浪热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>AI女演员60秒广告报价超25万元<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>三星中国清退月销不达标手机门店<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>空调24小时不关更省电 电力公司回应<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>日子不是被大事推着往前走的，是被你今天认真做完的那几件小事一点点垫高的。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">每天只问一个，评论区打一行字就算参与。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#16A085;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">填空</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">今天一根“浓油赤酱”的玉米冲上热搜，清甜派和重口派各说各的理</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;\">夏天我家的玉米，一般＿＿＿着吃，配一份＿＿＿。</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">照着这行复制，把两个空填上发过来。例：夏天我家的玉米，一般水煮着吃，配一份冰镇绿豆汤。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">评论区见，明天挑几种最馋人的吃法念出来。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-03", "title": "报简说 | 每日消息早知道（8月3日）", "digest": "早安！周一好，农历六月廿一，新一周开工，先花两分钟把天下事看个大概。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月3日 星期一 农历六月廿一</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！周一好，农历六月廿一，新一周开工，先花两分钟把天下事看个大概。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>美国总统特朗普宣布同意取消对伊朗的军事打击，称有关各方已就开放霍尔木兹海峡初步达成协议框架。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>伊朗军方回应称部队仍处于最高戒备状态，并表示目前重开霍尔木兹海峡的计划纯属谣言。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>西班牙政府驻休达代表通报，近期大规模非法移民越境事件已造成72人死亡，边境秩序正逐步恢复。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>欧盟将于4日召开成员国内政部长紧急视频会议，讨论西班牙飞地休达移民危机及应对措施。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>欧洲多国持续高温干旱，多瑙河等多地河流水位降至历史新低，航运与农业生产受到影响。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>中国人民银行召开下半年工作会议，提出继续实施好适度宽松的货币政策，加大逆周期调节力度。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>上海港单昼夜集装箱吞吐量8月1日达到203881标准箱，刷新6月创下的历史纪录。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>欧佩克发表声明称，沙特、俄罗斯等7个主要产油国决定9月起日均增产原油18.8万桶。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>工业和信息化部发布《工业绿色低碳发展“十五五”规划》，提出培育建设零碳工厂500个。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>中国轻工业联合会：上半年规模以上轻工业增加值同比增长5.0%，实现营业收入11.2万亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>神舟二十三号乘组完成首批太空水稻样品采集与存储，该实验有望在轨连续培养两代水稻。<span style=\"color:#999;font-size:12px;\">（央视网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>我国首台掘爆机翔龙号在武汉下线，融合掘进法与钻爆法，填补复杂地质隧道施工装备空白。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>中亚人工智能协会主席表示，世界人工智能合作组织成立是国际社会人工智能治理的重要里程碑。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>中国科学院上海技物所团队突破长波红外探测器暗电流难题，相关器件已应用于遥感卫星。<span style=\"color:#999;font-size:12px;\">（央视网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>四川宜宾高县3日凌晨发生4.8级地震，震源深度6公里，当地暂未接报人员伤亡等情况。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>国家防总、应急管理部针对北京、河北、贵州启动防汛四级应急响应，并派工作组赴一线。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>总台《财经调查》曝光高空秋千等网红游乐项目无国标、无检测，行业监管尚存在空白地带。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>国家药监局修订感冒灵颗粒等说明书警示语，明确服药期间不得驾驶机、车、船及从事高空作业。<span style=\"color:#999;font-size:12px;\">（人民日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>河南通报2026年三支一扶招募考试查实作弊行为，省人事考试中心负责人已被停职调查。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>据网络平台数据，2026年暑期档电影票房含预售突破71亿元，年度总票房超228亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>周星驰执导的《功夫女足》暑期档票房超21亿元，位居2026年度电影票房榜第二位。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>2026世界斯诺克上海大师赛决赛中，英格兰选手特鲁姆普11比6战胜同胞威尔逊夺冠。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>郑钦文在WTA1000多伦多站资格赛以0比2不敌泰国选手塔拉鲁迪，无缘本站正赛。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>国家电影局、市场监管总局联合印发通知，鼓励影院打造集观影、社交、消费的文化空间。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>三个字让我爸做了一辈子饭<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>超强台风白海豚或成今年风王<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>民警外出点餐一眼认出小偷<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>网民造谣淮北室外83摄氏度被处罚<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>孩子地铁站写作业辅警搭起学习角<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>共享儿女上门养老服务引讨论<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>中俄首条跨境索道主体工程完工<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>社会团体分支机构负责人须改称谓<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">9. </span>窦文涛问鲁豫世间本无事庸人自扰<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>新的一周不必一上来就冲刺，把手边这一件事做扎实，节奏自然会跟上来。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">每天只问一个，评论区打一行字就算参与。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#8E44AD;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">上期揭晓</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">上期请你写下「城市＋看了几部＋最想推荐的一部」，今天先把片单揭晓</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;\">暑期档票房已超71亿：《功夫女足》超21亿领跑，《八仙！》破8亿，《给阿嬷的情书》延长放映</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">上期没写的今天补一行也算数，明天挑几条念给大家听。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">评论区见，你写下的片名我都看得到。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-02", "title": "报简说 | 每日消息早知道（8月2日）", "digest": "早安！周日好，雨带横跨大半个中国，出门先看一眼天气。几分钟速览天下事。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月2日 星期日 农历六月二十</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安！周日好，雨带横跨大半个中国，出门先看一眼天气。几分钟速览天下事。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>美国国务院向身处中东地区的美国公民发出安全警告，建议考虑离开当地或做好迅速撤离准备。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>伊朗方面表示已制定全面计划，以应对美方可能采取的军事行动，包括打击地区能源基础设施。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>西班牙休达大规模非法越境事件已致至少67人死亡，绝大多数移民返回摩洛哥，边境秩序基本恢复。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>美国国务院将面向部分国家公民的签证保证金制度长期化，50个国家公民面临最高2万美元保证金。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>俄罗斯方面通报，莫斯科市中心一家餐厅发生自制爆炸装置爆炸，已造成3人死亡、21人受伤。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>商务部就美方将中国企业列入涉疆法案实体清单答记者问，表示中方强烈谴责、坚决反对。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>第十二批国家组织药品集采开标，65种药品采购成功，327家企业521个产品拟中选。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>电动汽车供电设备强制性产品认证8月1日起强制实施，未获认证不得出厂、销售或进口。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>《个人贷款业务明示综合融资成本规定》1日起施行，六大国有银行公布个人贷款成本上限。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>国家发展改革委表示，正抓紧研究制定扩大内需战略实施方案，惠民生与促消费紧密结合。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>我国首次依托水上通信渠道推送北极航道海冰预报，覆盖东西伯利亚海等四大核心海域，每日更新。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>消息称长鑫存储LPDDR6接近研发验证尾声，速率达12800Mbps，有望下半年量产。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>零跑汽车7月全球交付101267台，同比增长102%，单月交付量首次突破10万台。<span style=\"color:#999;font-size:12px;\">（IT之家）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>百千瓦级竹基海上光伏平台集林二号在山东烟台完成安装，可降低对海洋生态环境的影响。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>海南自贸港华能昌江核电二期3号机组成功并网，预计投产后年发电量可达180亿千瓦时。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>中央气象台预报，未来3天夏季主雨带稳定维持，强降雨、强对流天气将影响大半个中国。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>第13号台风白海豚维持超强台风级，5日夜间前对我国海区无影响，此后趋向东南沿海。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.7
