<script>
var DATA = [{"date": "2026-09-05", "title": "报简说 | 每日消息早知道（9月5日）", "digest": "2026-09-05 早安，来看看今天值得知道的事。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:24px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:15px;color:#888;margin:8px 0 0;\">2026年9月5日 星期六 农历7月24日</p><p style=\"font-size:15px;color:#888;margin:6px 0 0;\">2026-09-05 早安，来看看今天值得知道的事。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国内要闻</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>习近平致信祝贺中央广播电视总台《小喇叭》节目开播70周年，勉励少儿文艺工作者落实立德树人根本任务、传播真善美作品。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>第三十二次亚太经合组织中小企业部长会议4日在广州举行，国务院副总理张国清出席开幕式并致辞，称中小企业是推动创新的重要力量。<span style=\"color:#999;font-size:14px;\">（人民日报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>国家发展改革委表示，将在前期工作基础上追加安排1亿元中央预算内投资，支持福建省做好台风灾害灾后应急恢复。<span style=\"color:#999;font-size:14px;\">（中国新闻网）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>中央网信办等七部门印发《促进数字化绿色化协同转型发展实施方案（2026-2030年）》，提出“十五五”时期双化协同转型发展的思路目标与政策举措。<span style=\"color:#999;font-size:14px;\">（央视网）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>外交部发言人郭嘉昆主持例行记者会表示，中美双方应共同落实好两国元首重要共识，维护中美经贸关系稳定发展态势。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">6. </span>中国人民银行公告，将于开展5000亿元3个月期买断式逆回购操作，以保持银行体系流动性充裕，采用利率招标、多重价位中标方式。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1F618D;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">1. </span>乌克兰总统泽连斯基4日称，基辅市中心的乌国家安全局总部当天遭俄军无人机袭击，蓄意打击局长办公室，乌方已确定回应范围并准备择机实施对等回击。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">2. </span>美国总统特朗普4日在白宫接受采访时称，美国可能很快打击伊朗“镐山”核设施；美媒近期持续披露美对伊战事面临弹药库存不足问题。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">3. </span>据尼泊尔警方最新数据，截至当地时间4日20时，尼泊尔泥石流灾害遇难人数升至1325人，灾区救援与搜寻工作仍在持续进行。<span style=\"color:#999;font-size:14px;\">（参考消息）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">4. </span>以色列国防军4日晚发表声明称，作为对黎巴嫩真主党违反停火协议的回应，以军已对黎巴嫩南部地区实施空袭，并表示将追究相关违规责任。<span style=\"color:#999;font-size:14px;\">（环球时报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">5. </span>苏丹“苏丹医生网”4日声明称，苏丹南部南科尔多凡州多个地区遭武装分子袭击，造成包括妇女儿童在内的21名平民死亡、多人受伤。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>中国证监会就《私募投资基金募集监督管理办法（征求意见稿）》向社会公开征求意见，意见反馈截止时间为，旨在压实募集环节适当性义务。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>中国物流与采购联合会公布，9月份中国大宗商品价格指数为111.9点，环比上涨0.2%，已连续五个月实现环比上升，市场总体运行平稳。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>A股三大指数冲高回落集体收跌，上证指数跌0.30%报3930.12点，深证成指跌0.79%，创业板指跌0.78%，科创50指数跌幅居前。<span style=\"color:#999;font-size:14px;\">（证券时报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>8000亿元新型政策性金融工具首批资金近日在浙江、云南、新疆、四川等地相继投放，据测算有望撬动约10万亿元项目总投资以托底稳增长。<span style=\"color:#999;font-size:14px;\">（财联社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#117864;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">1. </span>我国行星探测工程天问三号任务已转入初样研制阶段，计划2028年前后发射、2031年前后携火星样品返回地球，将探寻火星生命痕迹。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">2. </span>OpenAI于发布旗舰大模型GPT-6 Astra，称其为迄今能力最强、对齐程度最高的模型，可直接操作计算机完成编程、研究等任务。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">3. </span>国际天文学家团队利用南非MeerKAT射电望远镜，直接探测到来自遥远宇宙的中性氢微弱射电信号，为追踪宇宙大尺度结构提供新路径。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">4. </span>2026中国国际消费电子博览会在青岛开幕，主题为AI领航智启未来，约300家国内外企业参展，集中展示具身智能机器人等前沿成果。<span style=\"color:#999;font-size:14px;\">（科技日报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">5. </span>科技部发布消息，2026浦江创新论坛年会将于至14日在上海举办，已有50余个国家和地区的科技界代表报名参会。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">6. </span>新华财经刊文称，图灵量子创始人金贤敏表示，光量子计算正加快向芯片化、集成化演进，在特定问题上有望实现指数级算力提升。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>国家医保局4日在国新办发布会介绍，将推动超大城市取消灵活就业人员参保户籍限制，探索把居民医保缴费年限折算累计为职工医保年限。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>据疾控监测，2025年全国学生总体近视率为49.9%，较2018年累计下降3.7个百分点，近五年保持连续下降态势，防控成效持续向好。<span style=\"color:#999;font-size:14px;\">（中国青年报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>市场监管总局联合民政部4日举行发布会介绍《养老机构基本规范》等两项养老服务强制性国家标准，要求推动标准成为养老机构运行的硬约束。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>受强降雨影响，南铁自15时起停运杭深线莆田至泉州区间全部列车，并停运至6日峰福线列车，保障铁路运行安全。<span style=\"color:#999;font-size:14px;\">（澎湃新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>2026女篮世界杯4日在柏林开赛，中国队小组赛首战以61比94不敌卫冕冠军美国队，6日将对阵捷克队。<span style=\"color:#999;font-size:14px;\">（新华社）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>宁夏第二届残疾人运动会暨特殊奥林匹克运动会4日晚在银川开幕，残运会设田径、游泳、乒乓球、举重等11个竞赛项目。<span style=\"color:#999;font-size:14px;\">（中国青年报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>北京时间凌晨，美网女单第二轮中国选手郑钦文以6比4、2比6、6比1战胜哈萨克斯坦选手普丁塞娃，晋级32强。<span style=\"color:#999;font-size:14px;\">（澎湃新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>青春游学综艺《花儿与少年2026》4日中午在芒果TV上线首映篇，固定嘉宾包括吴君如、殷桃、林依晨、周冬雨、邓为等。<span style=\"color:#999;font-size:14px;\">（新京报）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>总台年代剧《生逢其时》4日晚起每晚20时在CCTV-1黄金档两集连播，故事聚焦时代浪潮下普通人的命运与成长。<span style=\"color:#999;font-size:14px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:18px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>我国正式启动国际地月立方星座大科学计划<span style=\"color:#999;font-size:14px;\">（知乎热榜）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>世界最长高铁跨海大桥主塔全部封顶<span style=\"color:#999;font-size:14px;\">（澎湃新闻）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>教育部启动人工智能+教师发展行动<span style=\"color:#999;font-size:14px;\">（今日头条）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>特斯拉无人驾驶出租车Cybercab在奥斯汀投入运营<span style=\"color:#999;font-size:14px;\">（微博热搜）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>深圳出台人形机器人产业方案攻坚自主化<span style=\"color:#999;font-size:14px;\">（36氪）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>华为小米荣耀手机今日集体调价<span style=\"color:#999;font-size:14px;\">（新浪热搜）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>国内首部AIGC长剧《后西游记》今日开播<span style=\"color:#999;font-size:14px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:18px;color:#333;line-height:1.9;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>长沙三部门约谈松果出行擅自投放共享电单车<span style=\"color:#999;font-size:14px;\">（百度热搜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:16px;color:#555;line-height:2.0;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>看清世界，也过好眼前这一天。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:18px;font-weight:bold;color:#07C160;margin:0 0 4px;\"></p><p style=\"font-size:15px;color:#666;line-height:1.9;margin:0 0 12px;\">AI进课堂渐成趋势，您怎么看</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#7F8C8D;color:#fff;font-size:13px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">闲聊</span></p><p style=\"font-size:16px;color:#333;line-height:1.9;margin:0;font-weight:bold;\">教育部正推进『人工智能+教师发展』培训，AI加速进入校园。结合孩子真实的在校体验，您希望AI在下一代的教育中承担怎样的角色？评论区聊聊</p></section><p style=\"font-size:15px;color:#666;line-height:1.9;margin:10px 0 0;text-align:center;\"></p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:14px;color:#aaa;text-align:center;line-height:2.0;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-14", "title": "报简说 | 每日消息早知道（8月14日）", "digest": "早安，周五愉快！", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月14日 星期五</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安，周五愉快！</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国内要闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>国务院公布修改和废止部分行政法规的决定，进一步优化营商环境，激发市场活力。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>六部门联合印发《生态保护\"十五五\"规划》，明确未来五年生态文明建设目标任务。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>国家数据局表示将加快打造具身智能、低空经济、生物制造等重点领域的数据高地。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>我国人工智能开源大模型全球累计下载量突破100亿次，多家企业在国际平台排名前列。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>狮子洋通道主桥狮子洋大桥锚碇主体施工完工，锚碇规模创同类工程世界纪录，串联粤港澳大湾区三大都市圈。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1F618D;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">1. </span>伊朗和美国代表将出席巴基斯坦主持的视频会议，讨论签署相关协议事宜。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">2. </span>美官员称美国将向中东部署\"华盛顿\"号航母，以应对地区局势变化。<span style=\"color:#999;font-size:12px;\">（每日经济新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">3. </span>美国宣布对进口无人机及零部件征收关税，涉及多个国家和地区产品。<span style=\"color:#999;font-size:12px;\">（每日经济新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">4. </span>日本企业物价指数同比上涨7.2%，连续两个月维持7%以上高位运行。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1F618D;font-weight:bold;\">5. </span>英国第二季度GDP环比增长0.4%，经济学家警告下半年经济可能进一步放缓。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>国家发改委宣布1880亿元超长期特别国债投资补助资金已全部下达，覆盖13个领域约8400个项目。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>中芯国际二季度销售收入30亿美元环比增长20%，三季度预计继续增长。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>OpenAI收入年化规模据悉突破400亿美元，自2025年底以来实现翻倍增长。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>赛轮轮胎拟投资2.91亿美元在埃及建设年产360万条子午线轮胎项目。<span style=\"color:#999;font-size:12px;\">（每日经济新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>美国7月PPI同比涨幅降至4.7%，交易员进一步下调美联储9月加息预期。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#117864;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">1. </span>工业级全功能全尺寸人形机器人在天津正式下线量产，标志具身智能产业取得新突破。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">2. </span>宇树科技科创板上市网上中签率仅0.0181%，创历史新低，吸引近千万户散户参与。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">3. </span>MiniMax开源H3模型在Hugging Face热度榜冲到第一，中国开源AI获全球认可。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">4. </span>日本政府正式启动面向AI机器人和物理AI的本土多模态基础模型开发项目FRONTia。<span style=\"color:#999;font-size:12px;\">（环球时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#117864;font-weight:bold;\">5. </span>Anthropic预计10月上市，投资方给出估值预期高达2万亿美元，或刷新IPO纪录。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>财政部等三部门联合发布的个人消费贷贴息政策正式实施，七大领域单笔5万元以上可获补贴。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>四川按每月200元每人补助普惠托育机构，广东发放500至2000元托育消费券。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>江苏省宣布自9月起免收高速公路车辆救援服务拖车、吊车费用。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>中疾控发布数据显示7月全国报告新增新冠确诊病例52.2万例，其中重症487例。<span style=\"color:#999;font-size:12px;\">（界面新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>宁波成为全国首个分布式光伏装机容量突破千万千瓦城市，年可产绿电100亿千瓦时。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>方硕租借加盟NBL长沙勇胜俱乐部，据悉其薪水为队史最高水准，引发球迷广泛关注。<span style=\"color:#999;font-size:12px;\">（新京报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>名古屋亚运会赞助商出现变动，部分中国企业调整赞助计划，主办方紧急寻求替代方案。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>美国\"林肯\"号航母多名水兵试图跳海事件引发关注，美海军已展开调查并加强心理疏导。<span style=\"color:#999;font-size:12px;\">（环球时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>前7月广东外贸稳居全国首位，广深港高铁跨境客流突破2000万人次，大湾区互联互通提速。<span style=\"color:#999;font-size:12px;\">（每日经济新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>美伊协议签署进展<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>OpenAI收入破400亿美元<span style=\"color:#999;font-size:12px;\">（百度热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>人形机器人量产下线<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>个人消费贷贴息政策实施<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>宁波光伏装机破千万千瓦<span style=\"color:#999;font-size:12px;\">（抖音热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>Anthropic估值2万亿美元<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>中芯国际三季度业绩指引<span style=\"color:#999;font-size:12px;\">（36氪）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>托育补贴最高2000元<span style=\"color:#999;font-size:12px;\">（新浪热搜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>晨光不负赶路人，时光不负有心人。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">周五了，聊点轻松的！</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#E67E22;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">盲猜</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">今年暑期档总票房你猜能破多少亿？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;letter-spacing:1px;\">我猜 <span style=\"color:#E67E22;font-weight:bold;\">＿＿＿＿</span> </p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">在评论区写下你的预测数字，等收官那天咱们来复盘！</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">评论区打一行字就行，明天这一栏公布结果。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-13", "title": "报简说 | 每日消息早知道（8月13日）", "digest": "早安，周四顺遂。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月13日 星期四</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安，周四顺遂。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>外交部发言人表示，中方愿同各方一道推动全球治理体系朝着更加公正合理方向发展。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>中国向非洲多国提供紧急粮食援助，首批物资已启运，助力当地应对旱灾影响。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>上合组织成员国文化部长会议在哈萨克斯坦举行，通过未来三年合作行动计划。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>中欧班列开行量持续增长，今年前七个月累计开行突破一万列，线路覆盖欧洲多国。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>国家统计局发布数据显示，7月份规模以上工业增加值同比增长5.1%，制造业稳步恢复。<span style=\"color:#999;font-size:12px;\">（国家统计局）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>央行开展逆回购操作，维护银行体系流动性合理充裕，货币市场利率保持平稳。<span style=\"color:#999;font-size:12px;\">（证券时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>沪深两市成交额连续三日突破万亿元，新能源板块表现活跃，北向资金净流入。<span style=\"color:#999;font-size:12px;\">（上海证券报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>财政部公布上半年全国一般公共预算收入情况，财政收入恢复性增长态势明显。<span style=\"color:#999;font-size:12px;\">（经济日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>科创板迎来开市七周年，上市公司数量突破五百七十家，硬科技企业集聚效应显现。<span style=\"color:#999;font-size:12px;\">（第一财经）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>我国科学家成功研制新型量子计算原型机，求解特定问题速度提升百万倍。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>国产大飞机C919新增两条国内航线，累计安全载客突破五十万人次。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>工信部发布智能网联汽车准入新规，明确自动驾驶系统测试与商用准入条件。<span style=\"color:#999;font-size:12px;\">（财联社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>华为发布新一代鸿蒙操作系统，设备连接数突破十亿，生态应用持续丰富。<span style=\"color:#999;font-size:12px;\">（IT之家）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>教育部部署秋季学期开学工作，要求各地做好校园安全隐患排查与传染病防控。<span style=\"color:#999;font-size:12px;\">（人民网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>全国铁路暑运累计发送旅客突破七亿人次，多条新线开通提升出行便利性。<span style=\"color:#999;font-size:12px;\">（中国青年报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>国家医保局公布新版药品目录调整方案，更多创新药有望纳入医保报销范围。<span style=\"color:#999;font-size:12px;\">（光明日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>应急管理部针对台风路径发布预警提示，沿海多地启动防台风应急响应机制。<span style=\"color:#999;font-size:12px;\">（中国新闻网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>农业农村部监测显示，全国蔬菜价格季节性回落，猪肉供应充足价格稳定。<span style=\"color:#999;font-size:12px;\">（中国政府网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>成都世界运动会进入倒计时，场馆建设全面完工，志愿者培训有序开展。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>国产动画电影《长安三万里》海外上映，票房口碑双收，传统文化引发共鸣。<span style=\"color:#999;font-size:12px;\">（环球时报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>中国女足公布新一期集训名单，备战亚运会，多名年轻球员首次入选。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>国家博物馆推出暑期夜场活动，延长开放时间满足观众参观需求。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>暑期档电影票房破纪录<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>国产大模型新品发布<span style=\"color:#999;font-size:12px;\">（百度热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>台风路径实时追踪<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>大学生特种兵式旅游<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>秋天的第一杯奶茶<span style=\"color:#999;font-size:12px;\">（抖音热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>黑神话悟空新预告<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>房贷利率调整解读<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>新能源汽车下乡<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>山不让尘，川不辞盈。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">立秋已过，暑气渐消。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#16A085;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">填空</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">季节体感</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;\"></p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">填城市、温度感受与秋日心愿</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">评论区打一行字就行，明天这一栏公布结果。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-12", "title": "报简说 | 每日消息早知道（8月12日）", "digest": "早安。风雨有时，晴空有期，愿你今天安稳顺遂。几分钟读罢，天下事尽在掌握。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月12日 星期三 农历丙午年六月三十</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安。风雨有时，晴空有期，愿你今天安稳顺遂。几分钟读罢，天下事尽在掌握。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>哥伦比亚发生7.4级强烈地震，习近平主席向哥总统致慰问电，我使馆启动应急机制排查，目前未接到中国公民伤亡报告。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>特朗普签署行政令拟调整美国儿童疫苗接种安排，引发医卫专家与部分国会议员担忧，舆论反应不一。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>叙利亚一法院缺席判处前总统巴沙尔死刑，国际社会对判决的合法性与后续执行力存在明显分歧。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">4. </span>西班牙休达危机数据更新，约8万移民涌入，当地政府加紧应对边境压力与安置管控难题。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">5. </span>英格兰近四分之三地区进入干旱状态，持续高温少雨令河流水位走低，农业与居民供水承压。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>31省份上半年财政收入出炉，广东规模稳居榜首，江苏浙江继续稳居全国二三位，均超5000亿元。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>上半年规模以上互联网企业完成收入10675亿元，同比增长10.1%，利润总额增长16.6%。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>布伦特油价突破每桶90美元，地缘局势与供需格局变化推动国际原油价格近期震荡上行。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>保险业对近期重大自然灾害累计赔付76亿元，22省份接报案67万件，理赔进度约57%。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>前7个月中老铁路进出口货值超200亿元，同比增长29.9%，跨境物流通道持续扩能增效。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">6. </span>两部门紧急预拨1.8亿元中央救灾资金，支持华东防汛与西北抗旱，保障群众基本生活。<span style=\"color:#999;font-size:12px;\">（中国政府网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>世界500兆瓦冲击式水电机组转子在西藏扎拉水电站成功吊装，投产后年发电近40亿千瓦时。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>我国科研团队在四川发现乌斯河锗矿，系新获批的独立锗酸盐矿物，丰富关键矿产资源家族。<span style=\"color:#999;font-size:12px;\">（科技日报）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>中国海军第49批护航编队将赴亚丁湾、索马里海域执行护航任务，维护国际航道通行安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>《煤炭工业发展十五五规划》正式发布，提出进一步优化开发布局，推进供应保障基地建设。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>中印尼海军舰艇将位台岛以东海域开展通航演练，重点进行通信操演、海上补给等科目训练。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>公安部网安局公布打击侵犯公民个人信息犯罪10起典型案例，曝光非法获取与倒卖手法。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>公安部扫黑除恶第一轮集中收网，打掉犯罪团伙1000余个，抓获犯罪嫌疑人8200余名。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>国家防总针对北京、天津、山西启动防汛四级应急响应，多地迎来一轮暴雨到大暴雨天气。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>7月全国受理网络举报1778.5万件，环比降0.5%、同比降5.1%，清朗行动持续推进。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>河南平顶山因强降雨发布停课停工停产停业通知，提醒当地广大群众减少外出并注意安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>上海明确台风天造成职工误工的，不得作迟到缺勤处理，也不得扣发工资，保障劳动权益。<span style=\"color:#999;font-size:12px;\">（澎湃新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>第38届大众电影百花奖揭晓，《哪吒之魔童闹海》获影片大奖，易烊千玺斩获男主角奖。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>截至8月11日，2026年度电影总票房突破245亿元，暑期档多部大片带动观影热潮。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>太湖发生2026年第1号洪水，安徽淠河同步出现编号洪水，沿岸加强巡查与排险工作。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>中国歌剧舞剧院讣告：人民艺术家郭兰英8月11日逝世，享年97岁，代表作品深入人心。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>WTT欧洲大满贯瑞典站第一个比赛日，国乒六人晋级32强，新老队员状态稳健、开局顺利。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>哥伦比亚7.4级强震，中方致慰问电<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>31省上半年财政收入出炉<span style=\"color:#999;font-size:12px;\">（百度热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>第38届百花奖揭晓<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>公安部扫黑除恶集中收网<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>台风白海豚停编多地仍暴雨<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>上海台风天误工不扣工资<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>984.5高校火了<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>电影票房破245亿<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>真正的从容，不是避开风雨，而是在雨里也能把脚步走稳。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">上期那张猜片名卡，答案今天揭晓了。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#8E44AD;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">上期揭晓</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">上期盲猜揭晓：第38届百花奖影片大奖</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;\">《哪吒之魔童闹海》</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">它也是今年暑期档的现象级动画，你上期猜中了吗？</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">明天的互动卡继续等你，评论区打一行字就行。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}, {"date": "2026-08-11", "title": "报简说 | 每日消息早知道（8月11日）", "digest": "早安。今天是丙午年六月廿九，周二，认真过好每一天，生活自会给出回应。", "html": "<section style=\"margin:0 8px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC',sans-serif;\"><section style=\"text-align:center;padding:18px 0 6px;\"><p style=\"font-size:21px;font-weight:bold;color:#222;margin:0;letter-spacing:1px;\"><span style=\"color:#C0392B;\">报简说</span><span style=\"color:#ccc;font-weight:normal;padding:0 6px;\">|</span>每日消息早知道</p><p style=\"font-size:13px;color:#888;margin:8px 0 0;\">2026年8月11日 星期二 农历丙午年六月廿九</p><p style=\"font-size:13px;color:#888;margin:6px 0 0;\">早安。今天是丙午年六月廿九，周二，认真过好每一天，生活自会给出回应。</p></section><section style=\"height:1px;background:#e5e5e5;margin:14px 0 4px;\"></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#C0392B;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">国际新闻</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">1. </span>朝鲜国际安保评论家发文，斥日本2026年版《防卫白皮书》是再侵略白皮书，呼吁国际社会警惕其军事大国化动向。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">2. </span>当地时间11日凌晨，俄军对乌克兰首都基辅发动弹道导弹袭击，市区连续传出强烈爆炸声，基辅市长确认遭袭。<span style=\"color:#999;font-size:12px;\">（新华社）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#C0392B;font-weight:bold;\">3. </span>欧洲、亚洲及中北美足联联合公开信再批国际足联，要求将FFE事件交由完全独立第三方审查，维护治理机制。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#B7791F;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">财经动态</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">1. </span>发改委、能源局印发《煤炭工业发展十五五规划》，提出到2030年基本建成现代煤炭产业体系，保障能源安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">2. </span>南水北调东中线一期工程累计调水突破900亿立方米，惠及7省市48座城市1.95亿人口，供水格局持续优化。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">3. </span>港珠澳大桥珠海公路口岸进出境车辆累计突破2500万辆次，单日峰值达2.97万辆次，大湾区联通再提速。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">4. </span>中央政府将于8月20日在澳门发行60亿元人民币国债，这是支持澳门离岸人民币市场发展的常态化举措。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">5. </span>商务部发布公告，决定对原产于墨西哥和美国的进口碧根果发起反倾销立案调查，维护国内产业公平竞争。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#B7791F;font-weight:bold;\">6. </span>财政部、应急管理部紧急预拨1.8亿元中央救灾资金，支持多地防汛防台风及抗旱，保障群众基本生活。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#1D6FA5;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">科技前沿</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">1. </span>全国用电负荷入夏以来第四次创历史新高，多地高温带动空调负荷攀升，电网企业全力保供迎峰度夏。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">2. </span>我国科学家发布最新月球『宝藏图』，系统梳理月球资源分布与演化，为后续月球探测提供关键参考。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">3. </span>2025年我国年度数据生产量达52.26ZB，同比增长显著，数据要素正成为驱动数字经济的新引擎。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">4. </span>AI视频大模型竞速商业化，多家企业密集落地应用，影视、广告、教育等内容生产迎来降本提速。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">5. </span>自动驾驶有了全国统一准入门槛，工信部发布相关标准，明确功能安全与测试要求，促进行业规范发展。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#1D6FA5;font-weight:bold;\">6. </span>从『中国神器』看中国制造迭代升级，高端装备、智能产线加速出海，产业链韧性与竞争力持续增强。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#2F855A;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">社会民生</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">1. </span>台风『白海豚』深入内陆，10余省份有强降雨，国家防减救灾委对浙江启动四级救灾应急响应并派工作组。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">2. </span>公安部指挥全国公安机关开展扫黑除恶专项斗争第一轮集中收网，打掉犯罪团伙千余个，抓获嫌疑人8200余名。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">3. </span>市场监管总局通报驾培行业抱团涨价、协会串谋等乱象，将保持反垄断高压，常态化整治违规收费行为。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">4. </span>针对总台报道乡村排污乱象，湖南冷水江、河北故城、湖北郧西分别通报，成立联合调查组核查整改。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">5. </span>北京市朝阳区市场监管局对潘家园附近眼镜市场开展专项执法检查，对涉嫌不合格太阳镜依法实施暂扣。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#2F855A;font-weight:bold;\">6. </span>近日全国多地持续高温，气象部门提醒做好防暑降温与能源保供，户外作业应避开高温时段保障安全。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#6B46C1;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">文体资讯</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">1. </span>第38届大众电影百花奖今日揭晓，多项大奖花落各家，国产现实题材影片与青年演员表现亮眼受关注。<span style=\"color:#999;font-size:12px;\">（央视新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">2. </span>第十二届全国少儿曲艺展演亮相，50个节目登台，涵盖相声、快板、评书等形式，展现少儿曲艺传承活力。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">3. </span>国家大剧院将经典电影《一江春水向东流》搬上话剧舞台，以话剧语汇重述时代故事，引发观众共鸣。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">4. </span>《开心消消乐》12周年庆大同站启幕，线上线下联动打造沉浸式文旅新体验，晋式消夏玩法受青睐。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#6B46C1;font-weight:bold;\">5. </span>2026世界人工智能大会发布《中国智能经济议题涌现报告》，梳理智能经济新趋势与产业落地路径。<span style=\"color:#999;font-size:12px;\">（新华网）</span></p></section><section style=\"margin-top:22px;\"><section style=\"display:inline-block;background:#D35400;color:#fff;font-size:15px;font-weight:bold;padding:5px 14px;border-radius:4px;\">热点榜单</section><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">1. </span>台风白海豚登陆浙江 多地紧急转移<span style=\"color:#999;font-size:12px;\">（微博热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">2. </span>第38届百花奖获奖名单公布<span style=\"color:#999;font-size:12px;\">（百度热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">3. </span>立秋后第一杯奶茶你喝了吗<span style=\"color:#999;font-size:12px;\">（抖音热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">4. </span>扫黑除恶第一轮收网行动<span style=\"color:#999;font-size:12px;\">（知乎热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">5. </span>开心消消乐12周年庆<span style=\"color:#999;font-size:12px;\">（哔哩哔哩热榜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">6. </span>南水北调调水破900亿立方<span style=\"color:#999;font-size:12px;\">（腾讯新闻）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">7. </span>驾培行业抱团涨价引热议<span style=\"color:#999;font-size:12px;\">（微信热搜）</span></p><p style=\"font-size:15px;color:#333;line-height:1.75;margin:12px 4px 0;\"><span style=\"color:#D35400;font-weight:bold;\">8. </span>港珠澳大桥破2500万辆次<span style=\"color:#999;font-size:12px;\">（今日头条）</span></p></section><section style=\"margin-top:26px;background:#f7f7f7;border-radius:8px;padding:16px 18px;\"><p style=\"font-size:14px;color:#555;line-height:1.8;margin:0;text-align:center;\"><span style=\"font-weight:bold;color:#333;\">【每日微语】</span>把平凡的一天过好，就是给未来的一份踏实交代。</p></section><section style=\"margin-top:26px;border:1px solid #d9f0e2;border-radius:10px;background:#f4fbf7;padding:16px 14px 18px;\"><p style=\"font-size:16px;font-weight:bold;color:#07C160;margin:0 0 4px;\">今日一问</p><p style=\"font-size:13px;color:#666;line-height:1.7;margin:0 0 12px;\">今天第38届大众电影百花奖揭晓，电影圈一年一度的高光时刻到了。</p><section style=\"background:#fff;border-radius:8px;padding:13px 14px 14px;margin-bottom:10px;\"><p style=\"margin:0 0 8px;\"><span style=\"display:inline-block;background:#E67E22;color:#fff;font-size:11px;font-weight:bold;letter-spacing:1px;border-radius:3px;padding:2px 7px;\">盲猜</span></p><p style=\"font-size:14px;color:#333;line-height:1.75;margin:0;font-weight:bold;\">你心目中的年度好片是哪一部？今年百花奖你最看好哪部？</p><section style=\"border:1px dashed #c9c9c9;border-radius:6px;background:#fafafa;padding:10px 12px;margin:10px 0 0;\"><p style=\"font-size:15px;color:#333;line-height:1.9;margin:0;text-align:center;letter-spacing:1px;\">我猜 <span style=\"color:#E67E22;font-weight:bold;\">＿＿＿＿</span> 影片</p></section><p style=\"font-size:12px;color:#999;line-height:1.7;margin:8px 0 0;\">在评论区打出你心里的那部片名，下期公布真实获奖名单。</p></section><p style=\"font-size:13px;color:#666;line-height:1.7;margin:10px 0 0;text-align:center;\">欢迎来评论区聊聊，你心里的那部片子说不定就是明天的黑马。</p></section><section style=\"margin-top:28px;padding-top:12px;border-top:1px solid #e5e5e5;\"><p style=\"font-size:12px;color:#aaa;text-align:center;line-height:1.8;margin:0;\">报简说 · 每日消息早知道<br>内容综合自新华社、人民日报、央视新闻等权威媒体公开报道<br>仅作信息分享，不构成任何建议</p></section></section>"}];
var cur = 0;

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

function render(i){
  cur = i;
  var d = DATA[i];
  document.getElementById('paper').innerHTML = d.html;
  document.getElementById('mTitle').textContent = d.title;
  document.getElementById('mDigest').textContent = d.digest || '';
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function(b, k){
    b.className = (k === i) ? 'on' : '';
  });
  window.scrollTo(0, 0);
}

function copyRich(){
  var node = document.getElementById('paper');
  var sel = window.getSelection();
  var range = document.createRange();
  range.selectNodeContents(node);
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  sel.removeAllRanges();
  if (ok) { toast('已复制，去订阅号助手粘贴'); return; }
  if (navigator.clipboard && window.ClipboardItem) {
    var html = node.innerHTML;
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([node.innerText], {type:'text/plain'})
    })]).then(function(){ toast('已复制，去订阅号助手粘贴'); })
      .catch(function(){ toast('自动复制失败，请长按正文手动全选'); });
  } else {
    toast('自动复制失败，请长按正文手动全选');
  }
}

function copyCode(){ copyText(DATA[cur].html, '源码已复制'); }

function copyText(txt, msg){
  var s = document.getElementById('sink');
  s.value = txt; s.select(); s.setSelectionRange(0, txt.length);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function(){ toast(msg); });
    return;
  }
  toast(ok ? msg : '复制失败');
}

(function init(){
  var tabs = document.getElementById('tabs');
  DATA.forEach(function(d, i){
    var b = document.createElement('button');
    b.textContent = d.date.slice(5);
    b.onclick = function(){ render(i); };
    tabs.appendChild(b);
  });
  // 支持 ?d=YYYYMMDD / ?d=YYYY-MM-DD：方糖推送链接带该参数时，确定性打开当天，避免看到过期构建
  var idx = 0;
  try {
    var q = new URLSearchParams(location.search).get('d');
    if (q) {
      var want = q.length === 8 ? (q.slice(0,4)+'-'+q.slice(4,6)+'-'+q.slice(6,8)) : q;
      DATA.forEach(function(d, i){ if (d.date === want) idx = i; });
    }
  } catch(e) {}
  render(idx);
})();
</script>
